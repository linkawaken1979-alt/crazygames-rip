/* =====================================================
   AUDIO UNLOCK
===================================================== */

var audioUnlocked = false;

function unlockAudio() {

    if (audioUnlocked)
        return;

    audioUnlocked = true;

    try {

        var AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AudioContext) {

            var ctx = new AudioContext();

            if (ctx.state === "suspended") {

                ctx.resume()
                    .then(function() {

                        console.log(
                            "[Audio] Browser audio unlocked"
                        );

                    })
                    .catch(function(){});

            } else {

                console.log(
                    "[Audio] Browser audio unlocked"
                );

            }

        }

    } catch(e) {

        console.warn(
            "[Audio] unlock failed",
            e
        );

    }

}

document.addEventListener(
    "pointerdown",
    unlockAudio,
    {passive:true}
);

    "keydown",

/* =====================================================
   PLAYER DATA
===================================================== */

function getTimestampInSeconds() {

    return Math.floor(Date.now() / 1000);

}


function IsDataValid(data) {

    return (
        data != null &&
        typeof data === "object" &&
        Object.keys(data).length > 0 &&
        "base64" in data
    );

}


function GetDataBase64(data) {

    if (IsDataValid(data))
        return data.base64;

    return "";

}


function PickData(local, cloud) {

    if (!IsDataValid(local))
        return cloud;

    if (!IsDataValid(cloud))
        return local;

    var localTimestamp =
        Number(local.timestamp || 0);

    var cloudTimestamp =
        Number(cloud.timestamp || 0);

    console.log(
        "[getPlayerData] local.timestamp:",
        localTimestamp
    );

    console.log(
        "[getPlayerData] cloud.timestamp:",
        cloudTimestamp
    );

    if (localTimestamp > cloudTimestamp) {

        console.log(
            "[getPlayerData] picked local data"
        );

        return local;

    }

    console.log(
        "[getPlayerData] picked cloud data"
    );

    return cloud;

}


function getPlayerData() {

    if (!myGameInstance)
        return;

    var localData = null;

    try {

        var localStr =
            localStorage.getItem(
                "take_actions_data"
            );

        if (localStr) {

            localData =
                JSON.parse(localStr);

            console.log(
                "[getPlayerData] localStorage parsed"
            );

        }

    } catch(e) {

        console.warn(
            "[getPlayerData] local parse failed",
            e
        );

    }


    var cloudData = null;

    try {

        var cloudString =
            window.CrazyGames.SDK.data.getItem(
                "take_actions_data"
            );

        if (cloudString) {

            cloudData =
                JSON.parse(cloudString);

        }

    } catch(e) {

        console.warn(
            "[getPlayerData] cloud unavailable",
            e
        );

    }


    var pickedData =
        PickData(localData, cloudData);

    var base64 =
        GetDataBase64(pickedData);

    try {

        myGameInstance.SendMessage(
            "Webgl",
            "GetPlayerDataCallback",
            base64
        );

    } catch(e) {

        console.warn(
            "[getPlayerData] SendMessage failed",
            e
        );

    }

}


function setPlayerData(gameName, version, base64) {

    var data = {

        timestamp:
            getTimestampInSeconds(),

        base64:
            base64

    };

    var stringified =
        JSON.stringify(data);

    try {

        localStorage.setItem(
            "take_actions_data",
            stringified
        );

    } catch(e) {

        console.warn(
            "[setPlayerData] local save failed",
            e
        );

    }

    try {

        window.CrazyGames.SDK.data.setItem(
            "take_actions_data",
            stringified
        );

    } catch(e) {

        console.warn(
            "[setPlayerData] cloud save failed",
            e
        );

    }

    console.log("[setPlayerData] saved");

}

async function showRewardAd() {

    if (!myGameInstance)
        return;

    try {

        var blocked =
            await window.CrazyGames.SDK.ad.hasAdblock();

        if (blocked) {

            myGameInstance.SendMessage(
                "Webgl",
                "ShowRewardAdOnAdBlock"
            );

            return;

        }

        window.CrazyGames.SDK.ad.requestAd(
            "rewarded",
            {

                adStarted:function() {

                    if (myGameInstance) {

                        myGameInstance.SendMessage(
                            "Webgl",
                            "ShowRewardAdOnOpen"
                        );

                    }

                },

                adFinished:function() {

                    if (!myGameInstance)
                        return;

                    myGameInstance.SendMessage(
                        "Webgl",
                        "ShowRewardAdOnRewarded"
                    );

                    myGameInstance.SendMessage(
                        "Webgl",
                        "ShowRewardAdOnClose"
                    );

                },

                adError:function() {

                    if (myGameInstance) {

                        myGameInstance.SendMessage(
                            "Webgl",
                            "ShowRewardAdOnError"
                        );

                    }

                }

            }
        );

    } catch(e) {

        console.warn("[showRewardAd]", e);

    }

}

function getOtherGames() {

function clickedOnOtherGameIcon(index, lang) {

    try {

        if (typeof otherGameList === "undefined")
            return;

        if (
            index < 0 ||
            index >= otherGameList.length
        )
            return;

        var game =
            otherGameList[index];

        if (!game || !game.url)
            return;

        var url =
            game.url[lang] ||
            game.url[0];

        if (url) {

            window.open(
                url,
                "_blank"
            );

        }

    } catch(e) {

        console.warn("[OtherGames]", e);

    }

}


/* =====================================================
   COMBINE WASM PARTS
===================================================== */

async function loadSplitWasm() {

    console.log(
        "[WASM] Downloading " +
        wasmParts.length +
        " parts..."
    );

    var responses =
        await Promise.all(
            wasmParts.map(function(url) {

                return fetch(url, {
                    cache: "no-cache"
                }).then(function(response) {

                    if (!response.ok) {

                        throw new Error(
                            "Failed to load WASM part: " +
                            url +
                            " (" +
                            response.status +
                            ")"
                        );

                    }

                    console.log(
                        "[WASM] Loaded:",
                        url
                    );

                    return response.arrayBuffer();

                });

            })
        );


    var totalSize = 0;

    for (var i = 0; i < responses.length; i++) {

        totalSize += responses[i].byteLength;

    }


    console.log(
        "[WASM] Combining " +
        responses.length +
        " parts (" +
        (totalSize / 1048576).toFixed(2) +
        " MiB)"
    );


    var wasmBlob =
        new Blob(
            responses,
            {
                type: "application/wasm"
            }
        );


    var wasmUrl =
        URL.createObjectURL(wasmBlob);


    console.log(
        "[WASM] Combined successfully"
    );


    return wasmUrl;

}


/* =====================================================
   START UNITY
===================================================== */

async function startGame() {

    console.log("================================");
    console.log("[BOOT] Starting Take Actions");
    console.log("================================");

    loadingBar.style.display = "block";


    /* -------------------------------------------------
       Verify CrazyGames SDK
    ------------------------------------------------- */

    if (
        !window.CrazyGames ||
        !window.CrazyGames.SDK
    ) {

        throw new Error(
            "CrazyGames SDK was not loaded."
        );

    }

    console.log(
        "[BOOT] CrazyGames SDK available"
    );


    /* -------------------------------------------------
       Loading start
    ------------------------------------------------- */

    try {

        window.CrazyGames.SDK.game.loadingStart();

        console.log(
            "[CrazyGames] loadingStart"
        );

    } catch(e) {

        console.warn(
            "[CrazyGames] loadingStart failed",
            e
        );

    }


    /* -------------------------------------------------
       Combine WASM
    ------------------------------------------------- */

    try {

        config.codeUrl =
            await loadSplitWasm();

    } catch(error) {

        console.error(
            "[WASM] FAILED TO COMBINE WASM",
            error
        );

        loadingBar.style.display = "none";

        try {

            window.CrazyGames.SDK.game.loadingStop();

        } catch(e) {}

        throw error;

    }


    /* -------------------------------------------------
       Load Unity loader
    ------------------------------------------------- */

    if (
        typeof createUnityInstance !==
        "function"
    ) {

        console.log(
            "[Unity] Loading Unity loader..."
        );

        await new Promise(function(resolve, reject) {

            var script =
                document.createElement("script");

            script.src =
                loaderUrl;

            script.onload =
                function() {

                    console.log(
                        "[Unity] Loader loaded"
                    );

                    resolve();

                };

            script.onerror =
                function() {

                    reject(
                        new Error(
                            "Unity loader failed to load: " +
                            loaderUrl
                        )
                    );

                };

            document.body.appendChild(script);

        });

    }


    if (
        typeof createUnityInstance !==
        "function"
    ) {

        throw new Error(
            "createUnityInstance is still unavailable."
        );

    }


    /* -------------------------------------------------
       Create Unity instance
    ------------------------------------------------- */

    console.log(
        "[Unity] Creating Unity instance..."
    );


    createUnityInstance(
        canvas,
        config,

        function(progress) {

            if (progressBarFull) {

                progressBarFull.style.width =
                    (100 * progress) + "%";

            }

        }

    )

    .then(function(unityInstance) {

        myGameInstance =
            unityInstance;

        window.myGameInstance =
            unityInstance;

        window.unityInstance =
            unityInstance;

        console.log(
            "[Unity] INSTANCE READY"
        );


        /* -----------------------------------------
           Loading stop
        ----------------------------------------- */

        try {

            window.CrazyGames.SDK.game.loadingStop();

            console.log(
                "[CrazyGames] loadingStop"
            );

        } catch(e) {

            console.warn(
                "[CrazyGames] loadingStop failed",
                e
            );

        }


        /* -----------------------------------------
           Hide loading bar
        ----------------------------------------- */

        loadingBar.style.display =
            "none";


        /* -----------------------------------------
           SDK callback
        ----------------------------------------- */

        try {

            myGameInstance.SendMessage(
                "Webgl",
                "OnSDKInitialized"
            );

        } catch(e) {

            console.warn(
                "[Unity] OnSDKInitialized failed",
                e
            );

        }


        /* -----------------------------------------
           Refresh callback
        ----------------------------------------- */

        window.addEventListener(
            "beforeunload",
            function() {

                if (!myGameInstance)
                    return;

                try {

                    myGameInstance.SendMessage(
                        "Webgl",
                        "OnRefresh"
                    );

                } catch(e) {}

            }
        );


        /* -----------------------------------------
           Focus
        ----------------------------------------- */

        canvas.focus();


        console.log("================================");
        console.log("[BOOT] TAKE ACTIONS READY");
        console.log("================================");

    })

    .catch(function(error) {

        console.error(
            "[Unity] START ERROR",
            error
        );

        loadingBar.style.display =
            "none";

        try {

            window.CrazyGames.SDK.game.loadingStop();

        } catch(e) {}

    });

}


/* =====================================================
   CRAZYGAMES SDK INITIALIZATION
===================================================== */

async function boot() {

    try {

        console.log(
            "[BOOT] Initializing CrazyGames SDK..."
        );


        if (
            !window.CrazyGames ||
            !window.CrazyGames.SDK
        ) {

            throw new Error(
                "CrazyGames.SDK is undefined. Check crazygames-sdk-v3.js."
            );

        }


        await window.CrazyGames.SDK.init();


        console.log(
            "[CrazyGames] SDK initialized"
        );


        await startGame();


    } catch(e) {

        console.error(
            "[BOOT ERROR]",
            e
        );

    }

}


/* =====================================================
   START
===================================================== */

boot();
