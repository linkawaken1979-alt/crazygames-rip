<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Tram Simulator</title>

  <style>
    html, body, #unity-container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font: 16px Arial, sans-serif;
      z-index: 2;
    }

    #error {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      color: #ff7777;
      font: 13px monospace;
      white-space: pre-wrap;
      z-index: 3;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading">Preparing Tram Simulator...</div>
  <div id="error"></div>

  <script>
    Object.defineProperty(document, "URL", {
      get: () => "https://www.crazygames.com/game/space-waves",
      configurable: true
    });

    Object.defineProperty(document, "documentURI", {
      get: () => "https://www.crazygames.com/game/space-waves",
      configurable: true
    });

    var gameInstance = null;
    var msgQueue = [];

    function SendMessage(obj, method, param) {
      if (gameInstance) {
        gameInstance.SendMessage(obj, method, param);
      } else {
        msgQueue.push([obj, method, param]);
      }
    }

    window.unityInstance = {
      SendMessage: SendMessage
    };

    window.UnitySDK = window.UnitySDK || {
      logError: function() {
        console.error.apply(console, arguments);
      }
    };

    document.getElementById("unity-canvas")
      .addEventListener("webglcontextlost", function(e) {
        e.preventDefault();
      });

    function showError(error) {
      console.error(error);
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").textContent =
        error && error.stack ? error.stack : String(error);
    }

    async function fetchPart(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          "Failed to load " + url + " (HTTP " + response.status + ")"
        );
      }

      return response.arrayBuffer();
    }

    async function joinParts(filename, count) {
      const parts = [];
      let totalSize = 0;
      const loading = document.getElementById("loading");

      for (let i = 0; i < count; i++) {
        const partName = filename + ".part" +
          String(i).padStart(3, "0");

        loading.textContent =
          "Loading " + filename + " — part " +
          (i + 1) + " of " + count;

        const buffer = await fetchPart("Build/" + partName);
        parts.push(buffer);
        totalSize += buffer.byteLength;
      }

      const combined = new Uint8Array(totalSize);
      let offset = 0;

      for (const part of parts) {
        combined.set(new Uint8Array(part), offset);
        offset += part.byteLength;
      }

      return combined.buffer;
    }

    function loadCrazyGamesSDK() {
      return new Promise(function(resolve) {
        const script = document.createElement("script");

        script.src =
          "https://raw.githubusercontent.com/linkawaken1979-alt/crazygames-rip/main/supermarket-simulator/crazygames-sdk-v3.js";

        script.onload = function() {
          if (!window.CrazyGames || !window.CrazyGames.SDK) {
            console.warn("CrazyGames SDK v3 API was not found.");
            resolve();
            return;
          }

          const initOptions = {
            origin: "https://www.crazygames.com"
          };

          window.CrazyGames.SDK.init(initOptions)
            .then(function() {
              SendMessage(
                "CrazySDKSingleton",
                "JSLibCallback_Init"
              );

              window.CrazyGames.SDK.ad.hasAdblock()
                .then(function(result) {
                  SendMessage(
                    "CrazySDKSingleton",
                    "JSLibCallback_AdblockDetectionResult",
                    result ? 1 : 0
                  );
                })
                .catch(function(error) {
                  window.UnitySDK.logError(
                    "Adblock detection failed:", error
                  );

                  SendMessage(
                    "CrazySDKSingleton",
                    "JSLibCallback_AdblockDetectionResult",
                    0
                  );
                });

              window.CrazyGames.SDK.user.addAuthListener(
                function(user) {
                  SendMessage(
                    "CrazySDKSingleton",
                    "JSLibCallback_AuthListener",
                    JSON.stringify({
                      userJson: JSON.stringify(user)
                    })
                  );
                }
              );
            })
            .catch(function(error) {
              console.error("CrazyGames SDK initialization failed:", error);
            })
            .finally(resolve);
        };

        script.onerror = function() {
          console.warn("CrazyGames SDK script failed to load.");
          resolve();
        };

        document.head.appendChild(script);
      });
    }

    async function startGame() {
      try {
        // Reassemble compressed files from numbered 20 MiB parts.
        const buffers = await Promise.all([
          joinParts("Tram4_CrazyGames.data.br", 4),
          joinParts("Tram4_CrazyGames.wasm.br", 3)
        ]);

        document.getElementById("loading").textContent =
          "Loading Unity loader...";

        const loaderScript = document.createElement("script");
        loaderScript.src = "Build/Tram4_CrazyGames.loader.js";

        await new Promise(function(resolve, reject) {
          loaderScript.onload = resolve;
          loaderScript.onerror = function() {
            reject(new Error("Failed to load Unity loader script."));
          };
          document.head.appendChild(loaderScript);
        });

        /*
         * These URLs contain the reconstructed compressed bytes.
         * The Unity loader must be able to handle Brotli data from
         * Blob URLs for this approach to work.
         */
        const dataUrl = URL.createObjectURL(
          new Blob([buffers[0]], {
            type: "application/octet-stream"
          })
        );

        const wasmUrl = URL.createObjectURL(
          new Blob([buffers[1]], {
            type: "application/wasm"
          })
        );

        const config = {
          dataUrl: dataUrl,
          frameworkUrl: "Build/Tram4_CrazyGames.framework.js.br",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Tram Simulator",
          productVersion: "1.0"
        };

        // Load SDK before Unity initialization so early callbacks can queue.
        await loadCrazyGamesSDK();

        document.getElementById("loading").textContent =
          "Starting Tram Simulator...";

        gameInstance = await createUnityInstance(
          document.getElementById("unity-canvas"),
          config,
          function(progress) {
            document.getElementById("loading").textContent =
              "Loading Tram Simulator... " +
              Math.round(progress * 100) + "%";
          }
        );

        window.unityInstance.SendMessage = function(obj, method, param) {
          gameInstance.SendMessage(obj, method, param);
        };

        while (msgQueue.length) {
          const msg = msgQueue.shift();
          gameInstance.SendMessage(msg[0], msg[1], msg[2]);
        }

        document.getElementById("loading").style.display = "none";

      } catch (error) {
        showError(error);
      }
    }

    startGame();
  </script>
</body>
</html>
