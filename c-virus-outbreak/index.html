<script>

Object.defineProperty(document, 'URL', {
    get: () =>

    configurable: true
});

    get: () =>
        'https://www.crazygames.com/game/space-waves',
    configurable: true
});


var msgQueue = [];
var gameInstance = null;


function sendToUnity(obj, method, param) {

    if (
        gameInstance &&
        gameInstance.SendMessage
    ) {

        try {

            gameInstance.SendMessage(
                obj,
                method,
                param
            );

        } catch (e) {

            console.warn(
                "Unity SendMessage failed:",
                obj,
                method,
                param,
                e
            );

        }

    } else {

        msgQueue.push([
            obj,
            method,
            param
        ]);

    }

}


window.unityInstance = {
    SendMessage: sendToUnity
};


var sdk = {

    init: function(cfg) {

        console.log(
            "[CrazyGames Shim] init",
            cfg
        );

        if (
            cfg &&
            cfg.crazySDKObjectName
        ) {

            sendToUnity(
                cfg.crazySDKObjectName,
                'OnSDKInit'
            );

        }

        return true;
    },

<!-- =========================================================
     DATA MERGE
     ========================================================= -->

<script>

const DATA_PARTS = [

    "Build/CG.data.unityweb.part001",
    "Build/CG.data.unityweb.part002",
    "Build/CG.data.unityweb.part003",
    "Build/CG.data.unityweb.part004"

];


var reconstructedDataUrl = null;


async function mergeDataParts() {

    const parts = [];

    let totalSize = 0;


    for (
        let i = 0;
        i < DATA_PARTS.length;
        i++
    ) {

        const filename =
            DATA_PARTS[i];


        status.textContent =
            "Loading DATA part " +
            (i + 1) +
            " / " +
            DATA_PARTS.length +
            "...";


        console.log(
            "[DATA] Loading:",
            filename
        );


        const response =
            await fetch(
                filename,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load " +
                filename +
                " (HTTP " +
                response.status +
                ")"
            );

        }


        const data =
            await response.arrayBuffer();


        /*
         * Reject the fake HTML error pages that
         * the server can return with HTTP 200.
         */

        if (
            data.byteLength === 8795 ||
            data.byteLength === 23031 ||
            data.byteLength === 0
        ) {

            throw new Error(
                "Invalid DATA part: " +
                filename +
                " (" +
                data.byteLength +
                " bytes)"
            );

        }


        parts.push(data);

        totalSize +=
            data.byteLength;


        console.log(
            "[DATA] Loaded:",
            filename,
            data.byteLength,
            "bytes"
        );


        setProgress(
            (i + 1) /
            DATA_PARTS.length *
            35
        );

    }


    console.log(
        "[DATA] Combining",
        parts.length,
        "parts..."
    );


    console.log(
        "[DATA] Total DATA size:",
        totalSize,
        "bytes"
    );


    status.textContent =
        "Combining DATA...";


    const combined =
        new Blob(
            parts,
            {
                type:
                    "application/octet-stream"
            }
        );


    reconstructedDataUrl =
        URL.createObjectURL(
            combined
        );


    console.log(
        "[DATA] Reconstructed DATA:",
        reconstructedDataUrl
    );


    return reconstructedDataUrl;

}

</script>

<!-- =========================================================
     XHR DATA REDIRECT
     ========================================================= -->

<script>

(function installDataRedirect() {

    const originalOpen =
        XMLHttpRequest.prototype.open;


    XMLHttpRequest.prototype.open =
        function(
            method,
            url,
            async,
            user,
            password
        ) {

            let finalUrl =
                String(url);


            /*
             * Only redirect the original
             * Unity DATA request.
             *
             * Everything else remains untouched.
             */

            if (
                reconstructedDataUrl &&
                finalUrl.indexOf(
                    "Build/CG.data.unityweb"
                ) !== -1
            ) {

                console.log(
                    "[DATA] XHR redirected:",
                    finalUrl,
                    "-> reconstructed DATA"
                );


                finalUrl =
                    reconstructedDataUrl;

            }


            /*
             * Preserve UnityLoader's original
             * synchronous/asynchronous setting.
             */

            return originalOpen.call(
                this,
                method,
                finalUrl,
                async,
                user,
                password
            );

        };

})();

</script>

<!-- =========================================================
     UNITY LOADER
     ========================================================= -->

<script>

var bar =
    document.getElementById("bar");

var status =
    document.getElementById("status");

var loading =
    document.getElementById("loading");


function setProgress(value) {

    value = Math.max(
        0,
        Math.min(
            1,
            value
        )
    );


    bar.style.width =
        (value * 100) + "%";

}


function hideLoading() {

    setProgress(1);

    status.textContent =
        "Starting game...";


    setTimeout(function() {

        loading.style.display =
            "none";

    }, 500);

}


async function startGame() {

    try {

        /*
         * First reconstruct CG.data.unityweb.
         */

        await mergeDataParts();


        /*
         * Now load the original UnityLoader.
         */

        status.textContent =
            "Loading UnityLoader...";


        var unityLoader =
            document.createElement(
                "script"
            );


        unityLoader.src =
            "Build/UnityLoader-v3.js";


        unityLoader.onload =
            function() {

                console.log(
                    "[Unity] UnityLoader loaded"
                );


                status.textContent =
                    "Initializing Unity...";


                try {

                    if (
                        typeof UnityLoader ===
                        "undefined"
                    ) {

                        throw new Error(
                            "UnityLoader is undefined"
                        );

                    }


                    gameInstance =
                        UnityLoader.instantiate(
                            "gameContainer",
                            "Build/CG.json",
                            {

                                onProgress:
                                    function(
                                        instance,
                                        progress
                                    ) {

                                        if (
                                            instance &&
                                            !gameInstance
                                        ) {

                                            gameInstance =
                                                instance;

                                        }


                                        /*
                                         * Reserve the
                                         * first 35% for
                                         * DATA merging.
                                         */

                                        var finalProgress =
                                            0.35 +
                                            progress * 0.65;


                                        setProgress(
                                            finalProgress
                                        );


                                        status.textContent =
                                            "Loading... " +
                                            Math.round(
                                                progress * 100
                                            ) +
                                            "%";


                                        /*
                                         * Flush queued
                                         * Unity messages.
                                         */

                                        if (
                                            gameInstance &&
                                            gameInstance.SendMessage &&
                                            msgQueue.length
                                        ) {

                                            while (
                                                msgQueue.length
                                            ) {

                                                var msg =
                                                    msgQueue.shift();


                                                try {

                                                    gameInstance
                                                        .SendMessage(
                                                            msg[0],
                                                            msg[1],
                                                            msg[2]
                                                        );

                                                } catch (e) {

                                                    console.warn(
                                                        "[CrazyGames Shim] Queued message failed",
                                                        e
                                                    );

                                                }

                                            }

                                        }


                                        if (
                                            progress >= 1
                                        ) {

                                            hideLoading();

                                        }

                                    }

                            }
                        );


                    if (gameInstance) {

                        window.unityInstance =
                            gameInstance;

                    }


                } catch (error) {

                    console.error(
                        "[Unity] Failed to start:",
                        error
                    );


                    status.textContent =
                        "Failed to start Unity.";

                    status.style.color =
                        "#ff4444";

                }

            };


        unityLoader.onerror =
            function() {

                console.error(
                    "[Unity] Failed to load UnityLoader-v3.js"
                );


                status.textContent =
                    "Failed to load UnityLoader-v3.js";

                status.style.color =
                    "#ff4444";

            };


        document.body.appendChild(
            unityLoader
        );


    } catch (error) {

        console.error(
            "[DATA] Merge failed:",
            error
        );


        status.textContent =
            "Failed to load game DATA.";

        status.style.color =
            "#ff4444";

        console.error(
            error
        );

    }

}


/* =========================================================
   START
========================================================= */

startGame();

</script>
